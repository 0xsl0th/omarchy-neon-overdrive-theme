[general]
bars = 18
framerate = 30
autosens = 1

[input]
method = pipewire
source = auto
active = 1
remix = 1
virtual = 1

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 1
noise_reduction = 65
